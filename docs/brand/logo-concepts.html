<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 32px; background: #FAF7F2; font-family: Inter, system-ui, sans-serif; color: #14201B; }
  h1 { font: 700 26px "Space Grotesk"; margin: 0 0 4px; }
  .row { display: grid; grid-template-columns: 210px 1fr; gap: 28px; align-items: center; padding: 26px 0; border-bottom: 1px solid #DCE6DE; }
  .name { font: 700 22px "Space Grotesk"; } .why { font-size: 14px; color: #3A4A42; margin-top: 6px; line-height: 1.45; }
  .sizes { display: flex; align-items: end; gap: 22px; flex-wrap: wrap; }
  .lock { display: flex; align-items: center; gap: 10px; font: 700 30px "Space Grotesk"; letter-spacing: -0.01em; }
  .lock b { color: #1F7A4D; } .dark { background: #14201B; color: #fff; padding: 12px 18px; border-radius: 12px; } .dark b { color: #6fd39f; }
  .mono svg * { fill: #14201B !important; stroke: #FAF7F2 !important; }
  small { display: block; text-align: center; font-size: 11px; color: #5F6B64; margin-top: 4px; }
</style></head><body>
<h1>SokoBase logo concepts</h1>
<div style="font-size:14px;color:#5F6B64">Each shown as app icon (128 / 48 / 32 / 16 px), next to the wordmark, and on dark.</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- A. Awning + chat: a market stall awning sitting on a chat bubble -->
    <symbol id="A" viewBox="0 0 48 48">
      <rect width="48" height="48" rx="11" fill="#1F7A4D"/>
      <path d="M12.5 16h23a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3H21.5l-6.5 5.5V35h-2.5a3 3 0 0 1-3-3V19a3 3 0 0 1 3-3z" fill="#fff"/>
      <path d="M8 10h32v4.5H8z" fill="#C97A2B"/>
      <path d="M8 14.5h8v1.5a4 4 0 0 1-8 0zM24 14.5h8v1.5a4 4 0 0 1-8 0z" fill="#C97A2B"/>
      <path d="M16 14.5h8v1.5a4 4 0 0 1-8 0zM32 14.5h8v1.5a4 4 0 0 1-8 0z" fill="#F6E9DA"/>
      <path d="M16 10h8v4.5h-8zM32 10h8v4.5h-8z" fill="#F6E9DA"/>
      <circle cx="18.5" cy="25.5" r="2" fill="#1F7A4D"/><circle cx="24" cy="25.5" r="2" fill="#1F7A4D"/><circle cx="29.5" cy="25.5" r="2" fill="#1F7A4D"/>
    </symbol>
    <!-- B. Two market stalls stacked into an S -->
    <symbol id="B" viewBox="0 0 48 48">
      <rect width="48" height="48" rx="11" fill="#1F7A4D"/>
      <path d="M33 13.5H20a6.5 6.5 0 0 0 0 13h8a6.5 6.5 0 0 1 0 13H14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M27 8.5h11.5l-0.8 4.3a2.5 2.5 0 0 1-4.9 0 2.5 2.5 0 0 1-4.9 0z" fill="#C97A2B"/>
      <path d="M9.5 34.5H21l-0.8 4.3a2.5 2.5 0 0 1-4.9 0 2.5 2.5 0 0 1-4.9 0z" fill="#C97A2B" transform="translate(0 0)"/>
    </symbol>
    <!-- C. Shops stacked on a base, with an open doorway -->
    <symbol id="C" viewBox="0 0 48 48">
      <rect width="48" height="48" rx="11" fill="#1F7A4D"/>
      <rect x="11" y="11" width="11.5" height="11.5" rx="2.8" fill="#fff"/>
      <rect x="25.5" y="11" width="11.5" height="11.5" rx="2.8" fill="#C97A2B"/>
      <path d="M13.8 25.5h20.4a2.8 2.8 0 0 1 2.8 2.8v8.7H28v-4.6a4 4 0 0 0-8 0V37h-9v-8.7a2.8 2.8 0 0 1 2.8-2.8z" fill="#fff"/>
    </symbol>
  </defs>
</svg>

<template id="t"><div class="row">
  <div><div class="name"></div><div class="why"></div></div>
  <div>
    <div class="sizes">
      <div><svg width="128" height="128"><use/></svg><small>128</small></div>
      <div><svg width="48" height="48"><use/></svg><small>48</small></div>
      <div><svg width="32" height="32"><use/></svg><small>32</small></div>
      <div><svg width="16" height="16"><use/></svg><small>16</small></div>
      <div class="lock"><svg width="44" height="44"><use/></svg><span>Soko<b>Base</b></span></div>
      <div class="lock dark"><svg width="40" height="40"><use/></svg><span>Soko<b>Base</b></span></div>
      
    </div>
  </div>
</div></template>
<div id="list"></div>
<script>
  const items = [
    ["A", "A. Awning + chat", "A market-stall awning (the soko) on a chat bubble (the WhatsApp conversation where every sale happens). Reads as 'shop + talk to the seller'."],
    ["B", "B. Stalls forming an S", "The S of SokoBase drawn as a path between two stall awnings: many small businesses connected in one place."],
    ["C", "C. Shops on a base", "Two shops sitting on a solid base with an open doorway: a home base for every business, always open."],
  ];
  const t = document.getElementById("t");
  for (const [id, name, why] of items) {
    const n = t.content.cloneNode(true);
    n.querySelector(".name").textContent = name; n.querySelector(".why").textContent = why;
    n.querySelectorAll("use").forEach((u) => u.setAttribute("href", "#" + id));
    document.getElementById("list").appendChild(n);
  }
</script>
</body></html>
